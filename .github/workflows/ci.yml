name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      # Оптимизаторы вызываются как внешние процессы: без них часть тестов
      # не имеет предмета, поэтому ставим их в раннер.
      - name: Install image tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jpegoptim optipng pngquant gifsicle webp
      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress
      - name: PHPUnit
        run: vendor/bin/phpunit
